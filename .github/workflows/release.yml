name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - Makefile
      - "ds_store/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    uses: omzcj/release-ci/.github/workflows/source-release.yml@9e6c5af26117fd344905d93a0e16be0bbf4e62c5
    with:
      runner: macos-15-intel
      project-name: ds_store
      validate-command: make build && bin/ds_store help | grep -F 'ds_store monit'
      package-paths: |
        VERSION
        LICENSE
        Makefile
        ds_store
